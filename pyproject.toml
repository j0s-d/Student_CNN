[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "Student_CNN"
version = "0.1.0"
description = "Efficient face detection using modified MobileNetV2 and knowledge distillation"
requires-python = ">=3.10"
dependencies = [
    "torch==2.13.0+cu132",
    "torchvision==0.28.0+cu132",
    "numpy==2.5.2",
    "opencv-python==5.0.0.93",
    "pillow==12.3.0",
    "matplotlib==3.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]